[project]
name = "ml-flow-mrc"
version = "0.1.0"
description = "A Python project"
requires-python = ">=3.10"
dependencies = [
    "mlflow"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E = pycodestyle errors (PEP8 violations like indentation, spacing, etc.)
# F = Pyflakes errors (logic issues like undefined names, unused imports)
# W = pycodestyle warnings (style warnings, less strict than E)
# D = pydocstyle rules (docstring checks: presence, formatting, conventions)
select = ["E", "F", "W", "D"]
ignore = [
    "E501", # Ignore long line warnings
    "D202", # Allow blank line after class
    "D211", # Allow blank line before class
    "D212", # Ignore Line space error after """ in docstrings
    "D104", # Missing docstring in public package.
    "D100", # Missing docstring in public module
] 

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_flow_mrc"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true
